<div class="login-container">
  <h2>Войти в систему</h2>
  
  <form [formGroup]="formLoginUser" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label for="name">Имя пользователя</label>
      <input 
        id="name" 
        type="text" 
        formControlName="name" 
        placeholder="Введите имя"
        [class.invalid]="formLoginUser.get('name')?.invalid && formLoginUser.get('name')?.touched"
      />
      <div class="error-message" *ngIf="formLoginUser.get('name')?.invalid && formLoginUser.get('name')?.touched">
        Имя пользователя обязательно для заполнения
      </div>
    </div>

    <div class="form-group">
      <label for="password">Пароль</label>
      <input 
        id="password" 
        type="password" 
        formControlName="password" 
        placeholder="Введите ваш пароль"
        [class.invalid]="formLoginUser.get('password')?.invalid && formLoginUser.get('password')?.touched"
      />
      <div class="error-message" *ngIf="formLoginUser.get('password')?.invalid && formLoginUser.get('password')?.touched">
        Пароль должен быть не менее 6 символов
      </div>
    </div>
    <div class="register-link">
      Нет аккаунта? <a routerLink="/createUser">Зарегистрироваться</a>
    </div>
    <button type="submit" [disabled]="formLoginUser.invalid">
      Войти
    </button>

  </form>
</div>
