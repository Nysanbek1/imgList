<div class="login-container">
  <h2>Регистрация нового аккаунта</h2>
  
  <form [formGroup]="formCreateUser" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label for="name">Имя пользователя</label>
      <input 
        id="name" 
        type="text" 
        formControlName="name" 
        placeholder="Введите имя"
        [class.invalid]="formCreateUser.get('name')?.invalid && formCreateUser.get('name')?.touched"
      />
      <div class="error-message" *ngIf="formCreateUser.get('name')?.invalid && formCreateUser.get('name')?.touched">
        Имя пользователя обязательно для заполнения
      </div>
    </div>

    <div class="form-group">
      <label for="password">Пароль</label>
      <input 
        id="password" 
        type="password" 
        formControlName="password" 
        placeholder="Введите ваш пароль"
        [class.invalid]="formCreateUser.get('password')?.invalid && formCreateUser.get('password')?.touched"
      />
      <div class="error-message" *ngIf="formCreateUser.get('password')?.invalid && formCreateUser.get('password')?.touched">
        Пароль должен быть не менее 6 символов
      </div>
    </div>

    <div class="form-group">
      <label for="passwordTwo">Проверка пароля</label>
      <input 
        id="passwordTwo" 
        type="password" 
        formControlName="passwordTwo" 
        placeholder="Введите ваш пароль повторно"
        [class.invalid]="(formCreateUser.get('passwordTwo')?.invalid || formCreateUser.hasError('passwordsMismatch')) && formCreateUser.get('passwordTwo')?.touched"
      />
      
      <div class="error-message" *ngIf="formCreateUser.get('passwordTwo')?.invalid && formCreateUser.get('passwordTwo')?.touched">
        Повторите пароль (не менее 6 символов)
      </div>

      <div class="error-message" *ngIf="formCreateUser.hasError('passwordsMismatch') && formCreateUser.get('passwordTwo')?.touched && !formCreateUser.get('passwordTwo')?.invalid">
        Введенные пароли не совпадают
      </div>
    </div>

    <div class="register-link">
      Уже есть аккаунт? <a routerLink="/login">Войти</a>
    </div>

    <button type="submit" [disabled]="formCreateUser.invalid">
      Зарегистрироваться
    </button>

  </form>
</div>
